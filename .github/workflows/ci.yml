name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pcc_edms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, gd, pdo_mysql, pdo_pgsql

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y nodejs npm git

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Copy env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Prepare DB
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: pcc_edms
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --env=testing --no-interaction

      - name: Run composer audit
        run: composer audit --format=json || true

      - name: Run tests
        run: php artisan test --coverage

  node-build:
    runs-on: ubuntu-latest
    needs: php-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm deps
        run: npm ci

      - name: Build assets
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    needs: [php-tests, node-build]
    steps:
      - uses: actions/checkout@v4
      - name: Composer Security Audit
        run: composer audit || true
      - name: npm audit
        run: npm audit --audit-level=moderate || true
